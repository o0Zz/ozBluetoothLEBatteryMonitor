name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      SOLUTION: ozBluetoothLEBatteryMonitor.sln
      CONFIGURATION: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore $env:SOLUTION

      - name: Build
        run: msbuild $env:SOLUTION /p:Configuration=$env:CONFIGURATION /p:Platform="Any CPU" /m

      - name: Package release zip
        run: Compress-Archive -Path ozBluetoothLEBatteryMonitor/bin/Release/* -DestinationPath BluetoothLEBatteryMonitor-${{ github.ref_name }}.zip

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            BluetoothLEBatteryMonitor-${{ github.ref_name }}.zip
            ozBluetoothLEBatteryMonitor/bin/Release/BluetoothLEBatteryMonitor.exe
