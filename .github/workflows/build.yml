name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      SOLUTION: PeripheralBatteryMonitor.sln
      CONFIGURATION: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Compute version from git
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            # Tag builds carry a real version derived from the tag.
            $describe = git describe --tags --long --match 'v*' 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $describe) {
              $version = "0.0.0.0"
            } elseif ($describe -match '^v(\d+\.\d+\.\d+)-(\d+)-g[0-9a-f]+$') {
              $version = "{0}.{1}" -f $matches[1], $matches[2]
            } else {
              $version = "0.0.0.0"
            }
          } else {
            # master / manual builds are unreleased -> pin to 0.0.0.0.
            $version = "0.0.0.0"
          }
          Write-Host "Computed version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Patch AssemblyVersion and AssemblyFileVersion
        shell: pwsh
        run: |
          $file = "PeripheralBatteryMonitor/Properties/AssemblyInfo.cs"
          $content = Get-Content $file
          $content = $content -replace 'AssemblyVersion\("[^"]*"\)', 'AssemblyVersion("${{ steps.version.outputs.version }}")'
          $content = $content -replace 'AssemblyFileVersion\("[^"]*"\)', 'AssemblyFileVersion("${{ steps.version.outputs.version }}")'
          $content | Set-Content $file

      - name: Restore NuGet packages
        run: nuget restore $env:SOLUTION

      - name: Build
        run: msbuild $env:SOLUTION /p:Configuration=$env:CONFIGURATION /p:Platform="Any CPU" /m

      - name: Upload build artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: PeripheralBatteryMonitor-${{ steps.version.outputs.version }}
          path: PeripheralBatteryMonitor/bin/Release/*

      - name: Package release zip
        if: github.ref_type == 'tag'
        run: Compress-Archive -Path PeripheralBatteryMonitor/bin/Release/* -DestinationPath PeripheralBatteryMonitor-${{ github.ref_name }}.zip

      - name: Draft GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            PeripheralBatteryMonitor-${{ github.ref_name }}.zip
            PeripheralBatteryMonitor/bin/Release/PeripheralBatteryMonitor.exe
